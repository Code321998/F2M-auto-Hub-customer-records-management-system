<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F2M Auto-Hub | Service Management</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<section id="loginScreen" class="login-screen"><div class="login-card"><div class="brand">F2M<small>AUTO-HUB</small></div><p class="sub">Customer Service and Automotive Service Management</p><form id="loginForm"><div class="field"><label for="username">Username</label><input id="username" required autocomplete="username" placeholder="Enter username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password" placeholder="Enter password"></div><button type="submit" style="width:100%;margin-top:8px">Sign in →</button></form><p class="hint">Demo login: admin / admin123</p><p class="hint">This HTML-only demo stores records in this browser on this device.</p></div></section>
<div id="appScreen" class="layout hidden"><aside class="sidebar"><div class="brand">F2M<small>AUTO-HUB</small></div><div class="nav-label">MANAGEMENT MENU</div><button class="nav-item active" data-page="dashboard">▦ &nbsp; Dashboard</button><button class="nav-item" data-page="customers">♙ &nbsp; Customer Records</button><button class="nav-item" data-page="vehicles">🚘 &nbsp; Vehicle Records</button><button class="nav-item" data-page="appointments">▦ &nbsp; Appointments</button><button class="nav-item" data-page="requests">☷ &nbsp; Service Requests</button><button class="nav-item" data-page="history">↻ &nbsp; Service History</button><button class="nav-item" data-page="feedback">✉ &nbsp; Feedback & Concerns</button><button class="nav-item" data-page="notifications">♧ &nbsp; Notifications</button><button class="nav-item" data-page="visits">▤ &nbsp; Visit Records</button><button class="nav-item" data-page="reports">▥ &nbsp; Reports</button><button class="nav-item logout" id="logoutBtn">↪ &nbsp; Log out</button></aside><main class="main"><div id="flash" class="flash hidden"></div><div id="content"></div><footer>F2M Auto-Hub · Customer Service and Automotive Service Management</footer></main></div><div id="toast" class="hidden"></div>
<script src="app.js"></script></body></html>
